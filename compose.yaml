name: ${COMPOSE_PROJECT_NAME:-mentor-agent}

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${IMAGE_TAG:-local}
    image: mentor-agent:${IMAGE_TAG:-local}
    # 默认只绑定本机回环，前面套 Nginx/Caddy 再对外；应用认证不能替代 TLS/防火墙。
    # 想直接局域网访问就改成 "8501:8501"。
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    env_file: .env
    environment:
      # 国内服务器走 hf-mirror 下载模型；.env 里设了 HF_ENDPOINT 会覆盖这里
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      PYTHONUNBUFFERED: "1"
    volumes:
      # 数据组更新文档：改宿主机 knowledge_base/ 后跑一次 ingest（见 DEPLOY.md）
      - ./knowledge_base:/app/knowledge_base:ro
      # 向量库持久化，重建成本高，务必保留
      - ./chroma_db:/app/chroma_db
      # 用户库（SQLite），丢了所有账号就没了
      - ./data:/app/data
      # HF 模型缓存（bge-small-zh + reranker 共约 1.2GB），升级镜像不用重新下载
      - hf-cache:/root/.cache/huggingface
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  hf-cache:

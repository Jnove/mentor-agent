    detail_url_pattern: ''
    content_selector: ''
    title_selector: ''
    publish_rule: unknown
    normalize_headings: true
    defaults:
      tags: [百事通, 常见问题]
      applies_to: [未明确]
      campuses: [未明确]
      colleges: [未明确]

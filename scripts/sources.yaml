# 知识库来源注册表 v1
# 每个来源 = 一条固定爬虫配置，供 scripts/kb_crawl.py 使用。
# 字段说明见 scripts/kb_crawl.py 顶部注释。
version: 1

sources:
  - name: libweb-guizhang
    enabled: true
    source_org: 浙江大学图书馆
    authority_level: department
    category: 政策
    source_type: official_policy
    target_dir: 政策/图书馆
    base_url: https://libweb.zju.edu.cn
    list_url: https://libweb.zju.edu.cn/55987/list.htm
    detail_url_pattern: '^https://libweb\.zju\.edu\.cn/\d{4}/\d{4}/c55987a\d+/page\.htm$'
    content_selector: '.wp_articlecontent'
    title_selector: ''
    publish_rule: title_revision
    normalize_headings: true
    defaults:
      tags: [图书馆]
      applies_to: [未明确]
      campuses: [未明确]
      colleges: [未明确]
    maintainer: unassigned
    frequency: daily
    notes: 规章制度栏目，WebPlus 系统，正文容器统一；即首批 14 篇政策来源

  # 开放时间：各分馆开放时间表在分馆页正文里，不是详情页列表，
  # 需用 urls 静态列表模式（待 kb_crawl 支持后启用）。
  - name: libweb-open-hours
    enabled: false
    source_org: 浙江大学图书馆
    authority_level: department
    category: FAQ
    source_type: official_guide
    target_dir: FAQ/校园生活
    base_url: https://libweb.zju.edu.cn
    list_url: ''
    detail_url_pattern: ''
    content_selector: '.wp_articlecontent'
    title_selector: ''
    publish_rule: table_footer_date
    normalize_headings: false
    defaults:
      tags: [图书馆, 开放时间]
      applies_to: [未明确]
      campuses: [紫金港校区]
      colleges: [未明确]
    maintainer: unassigned
    frequency: weekly
    notes: 待实现 urls 静态列表 + 表脚日期解析


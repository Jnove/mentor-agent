# ================================================================
# 浙大百事通检索平台（s.zju.edu.cn）——校级统一检索（聚合发布，非 WebPlus 站点）
# 与其它来源不同：无需登录，走公开搜索接口（服务端渲染 HTML，UTF-8），
# 由 scripts/bst_crawl.py 采集（并发 8，实测 40 并发全秒回；kb_crawl.py 的
# --all 会跳过 crawler: bst 来源）。平台不产内容，是全校各处室已发布内容的
# 聚合检索；常用接口：
#   GET /search/faq.do?words=&pageNo=&pageSize=   常见问题（约 2409 条，问答/电话/部门）
#   GET /search/workGuide.do?words=...            办事指南（约 669 条）
#   GET /search/normFile.do?words=...             规范性文件（约 747 条，发文号/施行日期/PDF 全文）
#   GET /search/info.do?words=...                 网页资讯（全校网站索引，仅供实时检索不作快照）
# 已知现象：站点缓存分层导致办事指南条目在部分请求下带「点击详情」外链文本，

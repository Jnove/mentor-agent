# 字段说明见 scripts/kb_crawl.py 顶部注释。
version: 1

sources:
  - name: libweb-guizhang
    enabled: true
    source_org: 浙江大学图书馆
    authority_level: department
    category: 政策
    source_type: official_policy
    target_dir: 政策/图书馆
    base_url: https://libweb.zju.edu.cn
    list_url: https://libweb.zju.edu.cn/55987/list.htm
    detail_url_pattern: '^https://libweb\.zju\.edu\.cn/\d{4}/\d{4}/c55987a\d+/page\.htm$'
    content_selector: '.wp_articlecontent'
    title_selector: ''
    publish_rule: title_revision
    normalize_headings: true

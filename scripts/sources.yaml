      tags: [图书馆]
      applies_to: [未明确]
      campuses: [未明确]
      colleges: [未明确]
    maintainer: unassigned
    frequency: daily
    notes: 规章制度栏目，WebPlus 系统，正文容器统一；即首批 14 篇政策来源


# ================================================================
# 浙大百事通检索平台（s.zju.edu.cn）——校级统一检索（聚合发布，非 WebPlus 站点）
# 与其它来源不同：无需登录，走公开搜索接口（服务端渲染 HTML，UTF-8），
# 由 scripts/bst_crawl.py 采集（并发 8，实测 40 并发全秒回；kb_crawl.py 的

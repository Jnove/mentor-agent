name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Tests and knowledge release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMBED_BACKEND: hash
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve pinned knowledge revision
        id: knowledge-revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:knowledge_base)" >> "$GITHUB_OUTPUT"
      - name: Require private knowledge deploy key
        shell: bash
        env:
          KB_DEPLOY_KEY: ${{ secrets.KB_DEPLOY_KEY }}
        run: |
          if [[ -z "$KB_DEPLOY_KEY" ]]; then
            echo "::error::Configure the read-only KB_DEPLOY_KEY repository secret to checkout Jnove/mentor-agent-kb."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: Jnove/mentor-agent-kb
          ref: ${{ steps.knowledge-revision.outputs.sha }}
          path: knowledge_base
          ssh-key: ${{ secrets.KB_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify pinned knowledge submodule
        shell: bash
        run: |
          expected="$(git rev-parse HEAD:knowledge_base)"
          actual="$(git -C knowledge_base rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git -C knowledge_base status --porcelain)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked CPU dependencies
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None, torch.__version__"
      - name: Verify direct requirements are covered by the lock
        run: |
          python - <<'PY'
          from pathlib import Path

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          source_text = Path("requirements.txt").read_text(encoding="utf-8")
          lock_text = Path("requirements.lock").read_text(encoding="utf-8")
          assert "autogenerated by pip-compile with Python 3.12" in lock_text
          assert "# WARNING:" not in lock_text

          direct = [
              Requirement(line)
              for raw in source_text.splitlines()
              if (line := raw.strip()) and not line.startswith("#")
          ]
          locked = {}
          for raw in lock_text.splitlines():
              if not raw or raw[0].isspace() or raw.startswith("#"):
                  continue
              requirement = Requirement(raw.removesuffix("\\").strip())
              locked[canonicalize_name(requirement.name)] = requirement

          for requirement in direct:
              if requirement.marker and not requirement.marker.evaluate():
                  continue
              name = canonicalize_name(requirement.name)
              assert name in locked, f"{requirement.name} is missing from requirements.lock"
              locked_requirement = locked[name]
              assert not locked_requirement.marker or locked_requirement.marker.evaluate(), (
                  f"{requirement.name} is disabled by its lock marker on Linux"
              )
              pins = list(locked_requirement.specifier)
              assert len(pins) == 1 and pins[0].operator in {"==", "==="}, (
                  f"{requirement.name} is not exactly pinned in requirements.lock"
              )
              assert requirement.specifier.contains(pins[0].version), (
                  f"locked {requirement.name} {pins[0].version} violates {requirement.specifier}"
              )
          PY
      - name: Run all test modules
        shell: bash
        run: |
          for test_file in tests/test_*.py; do
            echo "::group::$test_file"
            python "$test_file"
            echo "::endgroup::"
          done
      - name: Audit pinned production knowledge snapshot
        run: |
          python scripts/govern_kb.py
          git diff --exit-code
          test -z "$(git -C knowledge_base status --porcelain)"
      - name: Validate Compose structure
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose \
            -f compose.yaml \
            -f deploy/compose.host-network.yaml \
            config --quiet

  image-gate:
    name: Build Linux production image
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image from the locked dependency set
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --tag "mentor-agent:$GITHUB_SHA" \
            .
      - name: Verify image metadata and CPU runtime
        run: |
          image_version="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            "mentor-agent:$GITHUB_SHA")"
          test "$image_version" = "$GITHUB_SHA"
          docker run --rm --entrypoint python "mentor-agent:$GITHUB_SHA" \
            -m pip check
          docker run --rm --entrypoint python "mentor-agent:$GITHUB_SHA" \
            -c "import torch; assert torch.version.cuda is None, torch.__version__"

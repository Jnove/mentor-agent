name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked CPU dependencies
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
      - name: Run unit and UI state tests
        env:
          EMBED_BACKEND: hash
        run: |
          python tests/test_core.py
          python tests/test_bst.py
          python tests/test_kb_schema.py
          python tests/test_kb_paths.py
          python tests/test_config_paths.py
          python tests/test_govern_kb.py
          python tests/test_ingest.py
          python tests/test_retrieval.py
          python tests/test_auth.py
          python tests/test_cookie_gate.py
          python tests/test_deploy_tools.py
      - name: Validate Compose structure
        run: |
          cp .env.example .env
          docker compose config --quiet
